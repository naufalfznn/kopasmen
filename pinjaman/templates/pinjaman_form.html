<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Form Tambah Pinjaman</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #fffbe6;
            font-family: 'Poppins', sans-serif;
        }
        .sidebar {
            background: linear-gradient(to bottom, #FFD700, #FFEE88);
            padding: 20px;
            height: 100vh;
        }
        .form-container {
            padding: 30px;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        .btn-tambah {
            background-color: #FFD700;
            border: none;
            color: black;
            font-weight: bold;
        }
        .btn-batal {
            background-color: #ccc;
            border: none;
            font-weight: bold;
        }
        .form-label {
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">

        <!-- Form -->
        <div class="col-9 form-container">
            <div class="form-card">
                <h4 class="mb-4">Form Tambah Pinjaman</h4>
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Nama</label>
                            {{ form.nomor_anggota }}
                        </div>
                        <div class="col">
                            <label class="form-label">Jenis Pinjaman</label>
                            {{ form.id_jenis_pinjaman }}
                        </div>
                    </div>

                    

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Admin</label>
                            {{ form.id_admin }}
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Tanggal Pinjam</label>
                            {{ form.tanggal_meminjam }}
                        </div>
                        <div class="col">
                            <label class="form-label">Lama Pinjaman</label>
                            {{ form.jatuh_tempo }}
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Jumlah Pinjaman</label>
                            {{ form.jumlah_pinjaman }}
                        </div>
                        <div class="col">
                            <label class="form-label">Jumlah Cicilan</label>
                            {{ form.angsuran_per_bulan }}
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Kategori Jasa</label>
                            {{ form.id_kategori_jasa }}
                        </div>
                        <div class="col">
                            <label class="form-label">Jumlah Jasa</label>
                            {{ form.jasa }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Status Pembayaran</label>
                        {{ form.status }}
                    </div>

                    <div class="text-end">
                        <button type="submit" class="btn btn-tambah px-4">Tambah</button>
                        <a href="{% url 'pinjaman_list' %}" class="btn btn-batal px-4">Batal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
