<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pinjaman</title>
</head>
<body>
    <h1>Tambah Pinjaman</h1>
    
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Simpan Pinjaman</button>
    </form>

    <a href="{% url 'pinjaman_list' %}">Kembali ke Daftar Pinjaman</a>
</body>
</html>
