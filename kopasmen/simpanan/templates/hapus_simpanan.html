<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapus Simpanan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>Hapus Semua Simpanan</h2>
    <p>Apakah kamu yakin ingin menghapus semua simpanan milik <b>{{ anggota.nama }}</b>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Ya, Hapus Semua</button>
        <a href="{% url 'detail_simpanan' anggota.nomor_anggota %}" class="btn btn-secondary">Batal</a>
    </form>
</div>
</body>
</html>
